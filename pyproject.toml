[project]
name = "nexus-decision"
version = "0.1.0"
description = "Runtime and training pipeline for nexus-decision-4b, an open-weight typed decision model with calibrated probabilities."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.32"]
hf = ["transformers>=4.57", "torch>=2.6", "accelerate>=1.0"]
data = ["openai>=1.50", "datasets>=3.0", "python-dotenv>=1.0", "pyyaml>=6.0", "tqdm>=4.66"]
release = ["huggingface_hub>=1.0", "jinja2>=3.1"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexus_decision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
