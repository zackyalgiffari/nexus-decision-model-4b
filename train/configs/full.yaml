# Full distillation run (see docs/training.md).
model: Qwen/Qwen3.5-4B
train_file: artifacts/data/train.jsonl
val_file: artifacts/data/val.jsonl
out_dir: artifacts/adapters/full
num_layers: 24
rank: 16
scale: 2.0
lr: 1.0e-4
warmup_steps: 50
epochs: 2
grad_accum: 8
max_seq_len: 2048
kl_weight: 1.0
lm_weight: 0.5
grad_checkpoint: true
save_every: 250
eval_every: 250
val_max_examples: 200
